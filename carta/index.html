<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nuestra carta · Olivo Café Resto</title>
  <meta name="description" content="La carta de Olivo Café Resto, para hojear como un libro." />
  <meta name="theme-color" content="#141a12" />
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./carta.css" />
</head>
<body>
  <header class="carta-header">
    <a class="carta-back" id="cartaBack" href="../">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
      <span>Volver</span>
    </a>
    <div class="carta-brand">
      <span class="carta-brand__word">olivo</span>
      <span class="carta-brand__sub">Nuestra carta</span>
    </div>
    <a class="carta-pdf" id="pdfLink" href="../assets/menu-cafeteria.pdf" target="_blank" rel="noopener" aria-label="Descargar PDF">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
      <span>PDF</span>
    </a>
  </header>

  <nav class="carta-tabs" aria-label="Elegir carta">
    <button type="button" class="carta-tab is-active" data-menu="cafeteria">Cafetería</button>
    <button type="button" class="carta-tab" data-menu="restaurante">Restaurante</button>
  </nav>

  <main class="carta-stage" id="stage">
    <div class="carta-loader" id="loader">
      <span class="carta-loader__ring" aria-hidden="true"></span>
      <p>Preparando la carta…</p>
    </div>
    <div class="carta-book-wrap" id="bookWrap" hidden>
      <div id="book"></div>
    </div>
    <p class="carta-error" id="bookError" hidden>
      No pudimos cargar la carta acá.
      <a id="errorPdfLink" href="../assets/menu-cafeteria.pdf" target="_blank" rel="noopener">Abrila en PDF</a>.
    </p>
  </main>

  <footer class="carta-controls" id="controls" hidden>
    <button type="button" class="carta-arrow" id="prevBtn" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="carta-progress">
      <span class="carta-pageinfo" id="pageInfo">– / –</span>
      <span class="carta-hint">Deslizá para pasar la página</span>
    </div>
    <button type="button" class="carta-arrow" id="nextBtn" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="./carta.js" defer></script>
</body>
</html>
